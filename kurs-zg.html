<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KURSY ZG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   USTAWIENIA DO ZMIANY PRZEZ ADMINA — patrz sekcja <script> niżej:
   ADMIN_NAMES  -> lista imion trzech administratorów
   APP_PASSWORD -> hasło wejściowe do aplikacji
   ============================================================ */

:root{
  --bg:#FFFFFF;
  --bg-card:#FFFFFF;
  --bg-alt:#F1EAD9;
  --ink:#2B2A26;
  --ink-soft:#726B5C;
  --ink-faint:#A79F8C;
  --indigo:#33415C;
  --indigo-deep:#212C40;
  --gold:#B8873F;
  --gold-soft:#E9D9BC;
  --moss:#6B7D5B;
  --ochre:#C17817;
  --line:#E7DFCB;
  --radius:14px;
  --shadow:0 1px 2px rgba(43,42,38,0.04), 0 4px 16px rgba(43,42,38,0.06);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--indigo-deep);
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--gold-soft);}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:32px;
  position:relative;
}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  max-width:560px;
  margin:0 auto;
  background:#3A2E22;
}
.login-photo-wrap{
  width:100%;
  position:relative;
  line-height:0;
  flex-shrink:0;
}
.login-photo-img{
  width:100%;
  height:auto;
  display:block;
}
.login-photo-wrap::after{
  content:'';
  position:absolute; left:0; right:0; bottom:0; height:110px;
  background: linear-gradient(180deg, rgba(58,46,34,0) 0%, #3A2E22 100%);
}
.login-content{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:14px 24px 32px;
  margin-top:-30px;
  position:relative;
  z-index:1;
}
.login-logo-plaque{
  background:#fff;
  border-radius:14px;
  padding:16px 22px;
  box-shadow:0 8px 28px rgba(0,0,0,0.35);
  margin-bottom:26px;
}
.login-logo{
  width:100%;
  max-width:230px;
  height:auto;
  display:block;
}
.login-wrap h1{
  font-family:'Inter',sans-serif;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.03em;
  font-size:1.6rem;
  margin:0 0 4px;
  text-align:center;
  color:#F3E9D8;
}
.login-sub{color:rgba(243,233,216,0.78);font-size:0.95rem;margin:0 0 32px;text-align:center;line-height:1.5;}
.field{width:100%;margin-bottom:14px;}
.field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
.login-wrap .field label{color:rgba(243,233,216,0.78);}
.field input, .field textarea{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:var(--bg-card);
  font-size:1rem;
  color:var(--ink);
  outline:none;
  transition:border-color .15s;
}
.field input:focus, .field textarea:focus{border-color:var(--indigo);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;
  border-radius:10px;
  border:none;
  font-size:0.95rem;
  font-weight:600;
  transition:transform .1s, opacity .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--indigo);color:#fff;width:100%;padding:13px;}
.btn-primary:hover{background:var(--indigo-deep);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--line);}
.btn-danger{background:transparent;color:#B4432F;}
.btn-sm{padding:8px 14px;font-size:0.85rem;}
.error-msg{color:#FF8A70;font-size:0.85rem;margin:-6px 0 12px;text-align:center;}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
.topbar-logo{height:24px;width:auto;}
.topbar h1{font-size:1.15rem;margin:0;}
.user-chip{
  font-size:0.78rem;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}
.admin-badge{
  background:var(--gold-soft);color:#7A5A20;
  padding:2px 8px;border-radius:20px;font-size:0.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
}
.logout-link{background:none;border:none;color:var(--ink-faint);font-size:0.78rem;text-decoration:underline;padding:0;}

/* ---------- Content ---------- */
.content{padding:20px;}
.section-title{
  font-size:0.78rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);font-weight:700;margin:0 0 14px;
}
.empty-state{
  text-align:center;padding:56px 20px;color:var(--ink-soft);
}
.empty-state .em-mark{
  width:36px;height:36px;margin:0 auto 14px;border-radius:50%;
  border:1.5px dashed var(--gold);
}
.empty-state p{font-size:0.92rem;line-height:1.6;margin:0;}

/* ---------- Course cards ---------- */
.course-card{
  background:var(--bg-card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:14px;
  cursor:pointer;
  border:1px solid var(--line);
  transition:transform .12s, box-shadow .12s;
}
.course-card:active{transform:scale(0.99);}
.course-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.date-badge{
  flex-shrink:0;
  background:var(--indigo);color:#fff;
  border-radius:10px;
  padding:8px 10px;
  text-align:center;
  min-width:52px;
}
.date-badge .d{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:600;line-height:1;}
.date-badge .m{font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
.course-card h3{font-size:1.05rem;margin:0 0 3px;}
.teacher-thumb{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--gold);background:#eee;}
.coord-summary{background:#fff;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.92rem;line-height:1.6;}
.coord-summary b{color:#7A5A20;}
.detail-head-row{display:flex;align-items:center;gap:14px;}
.detail-head-row>div{flex:1;min-width:0;}
.teacher-photo-lg{width:84px;height:84px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid var(--gold);}
.photo-edit{display:flex;align-items:center;gap:12px;}
.photo-edit .btn-mini{font-size:.8rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
.course-meta{font-size:0.82rem;color:var(--ink-soft);margin:0;}
.course-card-foot{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.fill-summary{font-size:0.78rem;color:var(--ink-soft);}
.fill-summary strong{color:var(--moss);}
.fill-summary.needs strong{color:var(--ochre);}
.chevron{color:var(--ink-faint);font-size:1.1rem;}

/* ---------- Detail view ---------- */
.detail-back{
  background:none;border:none;color:var(--indigo);font-size:0.88rem;font-weight:600;
  display:flex;align-items:center;gap:5px;padding:0 0 18px;
}
.detail-header h2{font-size:1.5rem;margin:0 0 6px;}
.detail-meta-row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:0.86rem;color:var(--ink-soft);margin-bottom:20px;}
.detail-meta-row span{display:flex;align-items:center;gap:5px;}
.detail-block{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;
}
.detail-block h4{
  font-size:0.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);
  margin:0 0 10px;font-weight:700;font-family:'Inter',sans-serif;
}
.detail-block p{font-size:0.92rem;line-height:1.65;margin:0;white-space:pre-wrap;color:var(--ink);}
.aktualnosci-block{background:var(--gold-soft);border-color:var(--gold);}
.aktualnosci-block h4{color:#7A5A20;}
.teacher-name{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;color:var(--indigo-deep);margin:0 0 6px;}

/* ---------- Volunteer / beads ---------- */
.vol-category{padding:14px 0;border-bottom:1px solid var(--line);}
.vol-category:last-child{border-bottom:none;}
.vol-cat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.vol-cat-name{font-weight:600;font-size:0.94rem;}
.vol-cat-count{font-size:0.78rem;color:var(--ink-soft);}
.beads{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.bead{
  width:15px;height:15px;border-radius:50%;
  border:1.5px solid var(--gold);
  background:transparent;
  transition:background .2s;
}
.bead.filled{background:var(--gold);}
.vol-names{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.name-chip{
  background:var(--bg-alt);color:var(--ink);
  padding:4px 10px;border-radius:20px;font-size:0.8rem;
  display:flex;align-items:center;gap:6px;
}
.name-chip button{background:none;border:none;color:var(--ink-faint);font-size:0.85rem;line-height:1;padding:0;}
.vol-cat-actions{display:flex;gap:8px;flex-wrap:wrap;}
.check-row{display:flex;align-items:center;gap:9px;font-size:0.88rem;color:var(--ink);cursor:pointer;}
.check-row input[type="checkbox"]{width:19px;height:19px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;}
.meal-table{width:100%;border-collapse:collapse;font-size:0.78rem;table-layout:fixed;margin-top:2px;}
.meal-table th,.meal-table td{border:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:top;}
.meal-table thead th{
  background:var(--bg-alt);color:var(--indigo-deep);font-weight:700;
  font-size:0.7rem;text-transform:uppercase;letter-spacing:.03em;padding:8px 4px;
}
.meal-table tbody th{
  background:var(--bg-alt);color:var(--ink);font-weight:600;text-align:left;
  padding-left:8px;font-size:0.78rem;white-space:nowrap;
}
.meal-table th:first-child, .meal-table td:first-child{width:74px;}
.meal-coord-row th, .meal-coord-row td{background:#FBF6EA;}
.meal-coord-row th{color:#7A5A20;}
.task-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.task-edit input[type=text]{flex:1 1 100%;min-width:0;}
.task-edit input[type=number]{width:80px;flex:0 0 80px;}
.task-edit span{flex:1;font-size:.9rem;color:var(--ink-soft);}
.task-edit .btn{flex:0 0 auto;padding:8px 14px;color:#B23A2E;}
.karma-card{background:#fff;border-radius:18px;padding:22px 22px 20px;max-width:320px;margin:0 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:karmaPop .35s ease-out;}
.karma-title{font-size:1.2rem;font-weight:800;line-height:1.25;margin:6px 0 4px;color:#2B2118;}
.karma-text{font-size:1.02rem;line-height:1.45;margin:8px 0 0;}
@keyframes karmaPop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.meal-off{background:#EFEAE2;color:#A89A86;font-size:1.1rem;vertical-align:middle !important;}
.meal-cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:34px;justify-content:center;}
.meal-cell-count{font-size:0.66rem;color:var(--ink-soft);}
.meal-cell-names{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;}
.name-chip-sm{
  background:#fff;color:var(--ink);border:1px solid var(--line);
  padding:1px 5px;border-radius:9px;font-size:0.63rem;
  display:flex;align-items:center;gap:2px;
}
.name-chip-sm button{background:none;border:none;color:var(--ink-faint);font-size:0.7rem;line-height:1;padding:0;}
.meal-check-wrap{display:flex;}
.meal-check{width:17px;height:17px;accent-color:var(--gold);cursor:pointer;}

/* ---------- Notes / timeline ---------- */
.timeline{position:relative;padding-left:22px;}
.timeline::before{
  content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;
  background:linear-gradient(var(--gold) 0%, var(--line) 100%);
}
.note-item{position:relative;margin-bottom:22px;}
.note-item::before{
  content:'';position:absolute;left:-22px;top:4px;
  width:11px;height:11px;border-radius:50%;background:var(--gold);
  border:2px solid var(--bg);
}
.note-date{font-size:0.76rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.note-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;
}
.note-author{font-weight:600;font-size:0.86rem;color:var(--indigo-deep);margin-bottom:4px;}
.note-content{font-size:0.9rem;line-height:1.6;white-space:pre-wrap;color:var(--ink);}
.note-actions{display:flex;gap:12px;margin-top:8px;}
.note-actions button{background:none;border:none;font-size:0.76rem;color:var(--ink-faint);padding:0;text-decoration:underline;}

.fab{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));
  right:max(20px, calc((100vw - 560px) / 2 + 20px));
  width:52px;height:52px;border-radius:50%;
  background:var(--indigo);color:#fff;border:none;
  font-size:1.5rem;box-shadow:0 4px 14px rgba(33,44,64,0.35);
  z-index:19;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(33,28,20,0.45);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:var(--bg);width:100%;max-width:560px;
  max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;
  padding:22px 20px calc(28px + env(safe-area-inset-bottom));
  animation:slideUp .22s ease-out;
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 18px;}
.modal-sheet h2{font-size:1.25rem;margin:0 0 18px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.vol-needs-grid{display:flex;flex-wrap:wrap;gap:10px;}
.vol-needs-grid .field{flex:1 1 130px;margin-bottom:0;}
.remove-row-btn{background:none;border:none;color:var(--ink-faint);font-size:1.1rem;padding:4px 8px;flex-shrink:0;}
.add-row-link{background:none;border:none;color:var(--indigo);font-size:0.85rem;font-weight:600;padding:6px 0;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--indigo-deep);color:#fff;padding:10px 18px;border-radius:30px;
  font-size:0.84rem;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,0.2);
  animation:fadeInUp .2s ease-out;
}
@keyframes fadeInUp{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);font-size:0.9rem;}

/* ---------- Wyzwanie 30 dni medytacji ---------- */
.med-tabs{display:flex;gap:8px;padding:10px 16px 0}
.med-tab{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--indigo-deep);border-radius:12px;padding:10px 6px;font-weight:700;font-size:.9rem;position:relative}
.med-tab.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.med-wrap{padding:16px}
.med-photo{text-align:center;margin-bottom:14px}
.med-photo img{display:block;margin:0 auto;max-width:100%;max-height:58vh;width:auto;height:auto;border-radius:var(--radius);box-shadow:var(--shadow)}
.med-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.med-hero{text-align:center}
.med-hero img{width:150px;display:block;margin:0 auto 6px}
.med-hero h2{font-size:1.5rem;margin:4px 0}
.med-sub{color:var(--ink-soft);line-height:1.45;font-size:.92rem;margin:6px 0 14px}
.med-total{text-align:center;background:linear-gradient(180deg,#fff,#fbf5e8)}
.med-total .big{font:600 2.2rem 'Fraunces',serif;color:#a8323a;line-height:1.1}
.med-total small{color:var(--ink-soft);font-weight:600}
.med-stats{display:flex;gap:8px;margin-bottom:12px}
.med-stat{flex:1;background:var(--bg-alt);border-radius:12px;padding:10px 4px;text-align:center}
.med-stat b{display:block;font:600 1.3rem 'Fraunces',serif;color:var(--indigo-deep)}
.med-stat span{font-size:.68rem;font-weight:700;color:var(--ink-soft);letter-spacing:.05em}
.med-bar{height:9px;border-radius:9px;background:var(--bg-alt);overflow:hidden;margin-bottom:6px}
.med-bar i{display:block;height:100%;background:linear-gradient(90deg,#e5484d,#f5a524,#f2d94e,#46a758,#3e63dd)}
.med-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.med-day{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:1rem;color:var(--ink);position:relative;padding:0;display:flex;align-items:center;justify-content:center}
.med-day.locked{opacity:.4}
.med-day.today{border:2.5px solid #a8323a;box-shadow:0 0 0 4px rgba(168,50,58,.14)}
.med-day.done{border:none;background:none}
.med-day svg{width:100%;height:100%}
.med-day .n{position:absolute;bottom:-1px;right:-1px;background:var(--ink);color:#fff;border-radius:9px;font-size:.58rem;padding:1px 5px}
.med-h{font:600 1.05rem 'Fraunces',serif;color:var(--indigo-deep);margin:0 0 6px}
.med-feed{list-style:none;margin:0;padding:0}
.med-feed li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.med-feed li:last-child{border:none}
.med-feed span{color:var(--ink-soft);font-size:.78rem;white-space:nowrap}
.med-banner{position:fixed;left:50%;transform:translateX(-50%);top:12px;max-width:520px;width:calc(100% - 24px);background:var(--indigo-deep);color:#fff;border-radius:14px;padding:12px 14px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:.92rem;display:flex;gap:10px;align-items:center;animation:karmaPop .3s ease-out}
.med-quote{font:500 1.08rem/1.5 'Fraunces',Georgia,serif;white-space:pre-line;text-align:left;border-left:3px solid #a8323a;padding-left:12px;margin:12px 2px 8px}
.med-quote.long{font-size:.95rem}
.med-author{font-weight:700;color:#7d1f27;text-align:right;font-size:.88rem;margin:0 2px 14px}
.med-row{display:flex;gap:8px}

</style>
</head>

<div id="app"></div>

function emptyVolunteer(){

    });
  });
  return v;
}

async function loadAll(){
  try{
    const snap = await getDoc(doc(db, 'kursZG', 'courses'));
    state.courses = snap.exists() ? (snap.data().list || []) : [];
    // zabezpieczenie dla kursów zapisanych przed zmianami w strukturze
    state.courses.forEach(course => {
      if(course.aktualnosci === undefined) course.aktualnosci = '';
      if(course.teacherPhoto === undefined) course.teacherPhoto = '';
      if(!Array.isArray(course.mealsOff)) course.mealsOff = [];
      if(!Array.isArray(course.customCats)) course.customCats = [];
      if(!Array.isArray(course.tasks)) course.tasks = [...ORG_CATS.map(c=>({key:c.key,label:c.label})), ...course.customCats.filter(x=>course.volunteerSlots[x.key])];
      if(course.coordinatorMeals === undefined) course.coordinatorMeals = '';
      course.volunteerSlots = Object.assign(emptyVolunteer(), course.volunteerSlots || {});
      // dawny wpis tekstowy "koordynator kursu" -> zapis w nowym polu zgłoszeń
      if(course.coordinatorAll && course.volunteerSlots.coord_course.people.length === 0){
        course.volunteerSlots.coord_course.people.push(course.coordinatorAll);
      }
      course.coordinatorAll = '';
    });
  }catch(e){ state.courses = []; showToast('Nie udało się wczytać danych z bazy.'); }
  state.loading = false;
  render();
}

}

/* Odmiana imienia w narzędniku (z kim?) — Bartek → Bartkiem, Ania → Anią */
function instrWord(w){
  const lw = w.toLowerCase();
  const cut = (n, add) => w.slice(0, w.length-n) + add;
  if(/(ski|cki|dzki)$/.test(lw)) return cut(1,'im');
  if(/(ska|cka|dzka)$/.test(lw)) return cut(1,'ą');
  if(/[^aeiouyąęó]eł$/.test(lw)) return cut(2,'łem');
  if(/[^aeiouyąęó]ek$/.test(lw)) return cut(2,'kiem');
  if(/[kg]$/.test(lw)) return w + 'iem';
  if(/a$/.test(lw)) return cut(1,'ą');
  if(/[iy]$/.test(lw)) return w + 'm';
  if(/o$/.test(lw)) return w + 'em';
  if(/e$/.test(lw)) return w;
  return w + 'em';
}
function instrName(full){
  return String(full).trim().split(/\s+/).map(x=>x.replace(/\d+$/,'')).filter(Boolean).map(instrWord).join(' ');
}

const REMEMBER_KEY = 'kurszg_remember';
function getSavedLogin(){
  try{
    const raw = localStorage.getItem(REMEMBER_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveLogin(name, password){
  try{ localStorage.setItem(REMEMBER_KEY, JSON.stringify({name, password})); }catch(e){}
}
function clearSavedLogin(){
  try{ localStorage.removeItem(REMEMBER_KEY); }catch(e){}
}

/* ============================================================
   LOGIN
   ============================================================ */
function attemptLogin(name, password, remember){
  if(!name.trim()){ state.loginError = 'Podaj imię.'; render(); return; }
  if(password !== APP_PASSWORD){ state.loginError = 'Błędne hasło.'; render(); return; }
  state.loggedIn = true;
  state.name = name.trim();
  state.isAdmin = norm(state.name).length > ADMIN_SUFFIX.length && norm(state.name).endsWith(ADMIN_SUFFIX);
  state.loginError = '';
  if(remember){ saveLogin(state.name, password); } else { clearSavedLogin(); }
  render();
  loadAll();
  medListen();
}
function logout(){
  medStop();
  state = { ...state, loggedIn:false, name:'', isAdmin:false, tab:'kursy', selectedCourseId:null, modal:null };
  render();
}

const MIESIACE = ['STY','LUT','MAR','KWI','MAJ','CZE','LIP','SIE','WRZ','PAŹ','LIS','GRU'];
function fmtBadge(dateStr){
  if(!dateStr) return {d:'--', m:''};
  const d = new Date(dateStr+'T00:00:00');
  return { d: d.getDate(), m: MIESIACE[d.getMonth()] };
}
function fmtLong(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const dni = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
  return `${d.getDate()} ${['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'][d.getMonth()]} ${d.getFullYear()}`;
}
function isMealOff(course, key){ return (course.mealsOff||[]).includes(key); }
function isDayOff(course, day){ return MEAL_TYPES.every(m=>isMealOff(course, `meal_${day.key}_${m.key}`)); }
function slotOff(course, key){
  if(ORG_KEYS.includes(key) || key.startsWith('custom_')) return !(course.tasks||[]).some(t=>t.key===key);
  if(key.startsWith('meal_')) return isMealOff(course, key);
  if(key.startsWith('coord_meals_')){ const d = MEAL_DAYS.find(x=>x.key===key.slice(12)); return d ? isDayOff(course, d) : false; }
  return false;
}
function volunteerTotals(course){
  let needed=0, filled=0;
  Object.keys(course.volunteerSlots).forEach(key=>{
    if(slotOff(course, key)) return;
    const v = course.volunteerSlots[key];
    needed += v.needed;
    filled += Math.min(v.people.length, v.needed);
  });
  return {needed, filled};
}

function render(){
  const app = document.getElementById('app');
  if(!state.loggedIn){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if(state.loading){ app.innerHTML = renderLoading(); return; }

  let html = renderTopbar();
  html += renderMedTabs();
  if(state.tab === 'med'){
    html += '<div class="med-wrap">' + renderMed() + '</div>';
  } else {
    html += '<div class="content">';
    html += state.selectedCourseId ? renderCourseDetail() : renderCourseList();
    html += '</div>';
  }
  if(state.tab !== 'med' && !state.selectedCourseId && state.isAdmin){
    html += `<button class="fab" id="fabAdd" title="Dodaj kurs">+</button>`;
  }
  if(state.modal) html += renderModal();
  if(state.catDialog) html += renderCatDialog();
  if(state.medPopup) html += renderMedPopup();
  if(state.notice || state.karma) html += `<div class="modal-overlay" id="noticeOverlay" style="align-items:center;justify-content:center;"><div class="karma-card">${state.karma ? KARMA_SVG + '<div class="karma-title">Brawo! Zdobywasz karma punkty!</div>' : '<div style="font-size:2rem;">🙏</div>'}${state.notice ? `<p class="karma-text">${escapeHtml(state.notice)}</p>` : ''}<button class="btn btn-gold" style="width:100%;padding:12px;margin-top:14px;" id="noticeOk">OK</button></div></div>`;
  if(state.toastMsg) html += `<div class="toast">${escapeHtml(state.toastMsg)}</div>`;

  app.innerHTML = html;
  attachEvents();
  attachMedEvents();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;
}

}
function attachLoginEvents(){
  const btn = document.getElementById('loginBtn');
  const doLogin = () => attemptLogin(
    document.getElementById('loginName').value,
    document.getElementById('loginPass').value,
    document.getElementById('loginRemember').checked
  );
  btn.addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginName').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

/* ---------- Course list ---------- */
function renderCourseList(){
  const sorted = [...state.courses].sort((a,b)=> (a.dateStart||'').localeCompare(b.dateStart||''));
  if(sorted.length===0){
    return `<div class="empty-state">
      <div class="em-mark"></div>
      <p>Nie ma jeszcze żadnych kursów.${state.isAdmin ? '<br>Dodaj pierwszy, stykając „+”.' : '<br>Zajrzyj tu wkrótce.'}</p>
    </div>`;
  }
  let html = `<div class="section-title">Nadchodzące kursy</div>`;
  sorted.forEach(course=>{
    const b = fmtBadge(course.dateStart);
    const {needed, filled} = volunteerTotals(course);
    const needsHelp = filled < needed;
    html += `
    <div class="course-card" data-course="${course.id}">
      <div class="course-card-top">
        <div class="date-badge"><div class="d">${b.d}</div><div class="m">${b.m}</div></div>
        ${course.teacherPhoto ? `<img class="teacher-thumb" src="${course.teacherPhoto}" alt="Nauczyciel">` : ''}
        <div style="flex:1;">
          <h3>${escapeHtml(course.title)}</h3>
          <p class="course-meta">${course.aktualnosci ? '📌 ' + escapeHtml(course.aktualnosci) : ''}</p>
        </div>
        <span class="chevron">›</span>
      </div>
      <div class="course-card-foot">
        <span class="fill-summary ${needsHelp?'needs':''}">Zapisanych osób: <strong>${filled}/${needed}</strong></span>
      </div>
    </div>`;
  });
  return html;
}

/* ---------- Course detail ---------- */
function renderCourseDetail(){
  const course = state.courses.find(c=>c.id===state.selectedCourseId);
  if(!course){ state.selectedCourseId=null; return renderCourseList(); }

  let html = `<button class="detail-back" id="backBtn">‹ Wszystkie kursy</button>`;
  html += `<div class="detail-header">
    <div class="detail-head-row">
      <div>
        <h2>${escapeHtml(course.title)}</h2>
        <div class="detail-meta-row">
          <span>📅 ${fmtLong(course.dateStart)}${course.dateEnd && course.dateEnd!==course.dateStart ? ' – ' + fmtLong(course.dateEnd) : ''}</span>
        </div>
      </div>
      ${course.teacherPhoto ? `<img class="teacher-photo-lg" src="${course.teacherPhoto}" alt="Nauczyciel">` : ''}
    </div>
  </div>`;

  {
    const vs = course.volunteerSlots;
    const cc = (vs.coord_course||{people:[]}).people;
    const activeDays = MEAL_DAYS.filter(d=>!isDayOff(course,d));
    const mealLines = activeDays.map(d=>({d, p:(vs[`coord_meals_${d.key}`]||{people:[]}).people})).filter(x=>x.p.length);
    if(cc.length || mealLines.length){
      const allSame = mealLines.length===activeDays.length && mealLines.every(x=>x.p.join('|')===mealLines[0].p.join('|'));
      html += `<div class="coord-summary">
        ${cc.length ? `<div><b>Koordynator kursu:</b> ${cc.map(escapeHtml).join(', ')}</div>` : ''}
        ${mealLines.length ? (allSame
          ? `<div><b>Koordynator posiłków:</b> ${mealLines[0].p.map(escapeHtml).join(', ')}</div>`
          : mealLines.map(x=>`<div><b>Koordynator posiłków — ${x.d.label}:</b> ${x.p.map(escapeHtml).join(', ')}</div>`).join('')) : ''}
      </div>`;
    }
  }

  if(course.aktualnosci){
    html += `<div class="detail-block aktualnosci-block">
      <h4>Aktualności</h4>
      <p>${escapeHtml(course.aktualnosci)}</p>
    </div>`;
  }
  if(course.program){
    html += `<div class="detail-block"><h4>Program kursu</h4><p>${escapeHtml(course.program)}</p></div>`;
  }
  html += `<div class="detail-block"><h4>Koordynator kursu</h4>`;
  html += renderVolCategory('coord_course', 'Koordynator całego kursu', course.volunteerSlots.coord_course);
  if(course.coordinatorMeals){
    html += `<p style="margin-top:8px;"><strong>Koordynator posiłków (wcześniejszy wpis):</strong> ${escapeHtml(course.coordinatorMeals)}</p>`;
  }
  html += `</div>`;

  html += `<div class="detail-block"><h4>Zadania organizacyjne</h4>`;
  (course.tasks||[]).forEach(t=>{
    const sl = course.volunteerSlots[t.key] || (course.volunteerSlots[t.key] = { needed:1, people:[] });
    html += renderVolCategory(t.key, escapeHtml(t.label), sl);
  });
  html += `</div>`;

  html += `<div class="detail-block"><h4>Koordynatorzy posiłków</h4>`;
  html += renderMealTable(course, COORD_ROWS);
  html += `</div>`;

  html += `<div class="detail-block"><h4>Przygotowanie posiłków</h4>`;
  html += renderMealTable(course, MEAL_ROWS);
  html += `</div>`;

  if(state.isAdmin){
    html += `<div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-ghost btn-sm" id="pdfCourseBtn">📄 Generuj PDF</button>
      <button class="btn btn-ghost btn-sm" id="editCourseBtn">Edytuj kurs</button>
      <button class="btn btn-danger btn-sm" id="deleteCourseBtn">Usuń kurs</button>
    </div>`;
  }
  return html;
}


/* ---------- PDF (A4): strona 1 program, strona 2 rozpiska ---------- */
function openCoursePdf(course){
  const w = window.open('', '_blank');
  if(!w){ alert('Przeglądarka zablokowała nowe okno. Zezwól na wyskakujące okna dla tej strony i spróbuj ponownie.'); return; }
  const E = escapeHtml;
  const vs = course.volunteerSlots || {};
  const ppl = k => ((vs[k]||{}).people||[]);
  const list = a => a.length ? a.map(E).join(', ') : '<span class="empty">—</span>';
  const logo = IMG_LOGO;
  const dates = fmtLong(course.dateStart) + (course.dateEnd && course.dateEnd!==course.dateStart ? ' – ' + fmtLong(course.dateEnd) : '');
  const days = MEAL_DAYS.filter(d=>!isDayOff(course,d));
  const dia = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><g fill="none" stroke="#a8323a" stroke-width="0.9" opacity="0.09"><path d="M32 6l13 14-13 22L19 20z"/><path d="M19 20h26M25 13l7 29M39 13l-7 29"/></g><g fill="none" stroke="#a8323a" stroke-width="0.6" opacity="0.06"><path d="M0 52l6-6 6 6-6 6zM58 52l6-6 6 6-6 6z"/></g></svg>');

  const need = k => Math.max(0, ((vs[k]||{}).needed||0));
  const missing = k => Math.max(0, need(k) - ppl(k).length);
  const badge = k => { if(!need(k)) return ''; const m = missing(k); return m ? `<span class="need">🌈➕ brakuje ${m} os. — karma punkty czekają!</span>` : `<span class="full">✓ komplet</span>`; };
  const gaps = [];
  const addGap = (label,k) => { const m=missing(k); if(m) gaps.push(`${label} (${m})`); };
  addGap('Koordynator kursu','coord_course');
  days.forEach(d=>addGap('Koordynator posiłków — '+d.label,'coord_meals_'+d.key));
  (course.tasks||[]).forEach(t=>addGap(t.label,t.key));
  let mealGap=0; days.forEach(d=>MEAL_TYPES.forEach(m=>{ mealGap+=missing(`meal_${d.key}_${m.key}`); }));
  if(mealGap) gaps.push(`przygotowanie posiłków (brakuje łącznie ${mealGap} — zobacz tabelę)`);
  let rows = `<tr><th>Koordynator kursu</th><td>${list(ppl('coord_course'))}${badge('coord_course')}</td></tr>`;
  days.forEach(d=>{ rows += `<tr><th>Koordynator posiłków — ${d.label}</th><td>${list(ppl('coord_meals_'+d.key))}${badge('coord_meals_'+d.key)}</td></tr>`; });
  (course.tasks||[]).forEach(t=>{
    const sl = vs[t.key] || {needed:1,people:[]};
    rows += `<tr><th>${E(t.label)}<small>potrzeba: ${sl.needed}</small></th><td>${list(sl.people||[])}${badge(t.key)}</td></tr>`;
  });
  let meals = `<tr><th></th>${days.map(d=>`<th>${d.label}</th>`).join('')}</tr>`;
  MEAL_TYPES.forEach(m=>{
    if(days.every(d=>isMealOff(course,`meal_${d.key}_${m.key}`))) return;
    meals += `<tr><th>${m.label}</th>${days.map(d=>{
      const k=`meal_${d.key}_${m.key}`;
      if(isMealOff(course,k)) return '<td class="off">—</td>';
      const sl = vs[k]||{needed:0,people:[]};
      const mm=missing(k); return `<td>${list(sl.people||[])}<small>${(sl.people||[]).length}/${sl.needed}</small>${sl.needed? (mm?'<span class="need">brakuje '+mm+' 🌈➕</span>':'<span class="full">✓ komplet</span>') : ''}</td>`;
    }).join('')}</tr>`;
  });

  const html = `<!doctype html><html lang="pl"><head><meta charset="utf-8">
<title>${E(course.title)} — program</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  w.document.open(); w.document.write(html); w.document.close();

/* ---------- Pojedyncza kategoria dyżuru (checkbox dla zalogowanych) ---------- */
function renderVolCategory(key, label, v){
  const already = v.people.some(p=>norm(p)===norm(state.name));
  const full = v.people.length >= v.needed;
  let beads = '';
  for(let i=0;i<v.needed;i++){
    beads += `<div class="bead ${i < v.people.length ? 'filled':''}"></div>`;
  }
  return `
  <div class="vol-category">
    <div class="vol-cat-top">
      <span class="vol-cat-name">${label}</span>
      <span class="vol-cat-count">${v.people.length}/${v.needed}</span>
    </div>
    <div class="beads">${beads}</div>
    <div class="vol-names">
      ${v.people.map(p=>`<span class="name-chip">${escapeHtml(p)}${(state.isAdmin || norm(p)===norm(state.name)) ? `<button data-remove-vol="${key}" data-remove-name="${escapeHtml(p)}">×</button>`:''}</span>`).join('')}
    </div>
    <label class="check-row">
      <input type="checkbox" data-vol-toggle="${key}" ${already?'checked':''} ${(!already && full)?'disabled':''}>
      <span>${already ? 'Zgłoszono — odznacz, aby się wypisać' : (full ? 'Komplet' : 'Zgłaszam się')}</span>
    </label>
  </div>`;
}

/* ---------- Tabela posiłków (dni x posiłki) ---------- */
const COORD_ROWS = [{ label:'Koordynator', keyFor: day => `coord_meals_${day.key}`, coord:true }];
const MEAL_ROWS = MEAL_TYPES.map(meal => ({ label: meal.label, keyFor: day => `meal_${day.key}_${meal.key}` }));

function renderMealTable(course, rows){
  let html = `<table class="meal-table"><thead><tr><th></th>${MEAL_DAYS.map(d=>`<th>${d.label}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(row=>{
    html += `<tr class="${row.coord ? 'meal-coord-row' : ''}"><th>${row.label}</th>`;
    MEAL_DAYS.forEach(day=>{
      const key = row.keyFor(day);
      if(slotOff(course, key)){ html += `<td class="meal-off" title="Tego posiłku nie ma w programie kursu">—</td>`; return; }
      const v = course.volunteerSlots[key];
      const already = v.people.some(p=>norm(p)===norm(state.name));
      const full = v.people.length >= v.needed;
      html += `<td>
        <div class="meal-cell">
          <span class="meal-cell-count">${v.people.length}/${v.needed}</span>
          ${v.people.length ? `<div class="meal-cell-names">${v.people.map(p=>`<span class="name-chip-sm">${escapeHtml(p)}${(state.isAdmin || norm(p)===norm(state.name)) ? `<button data-remove-vol="${key}" data-remove-name="${escapeHtml(p)}">×</button>` : ''}</span>`).join('')}</div>` : ''}
          <label class="meal-check-wrap" title="${already ? 'Wypisz się' : 'Zgłoś się'}">
            <input type="checkbox" class="meal-check" data-vol-toggle="${key}" ${already?'checked':''} ${(!already && full)?'disabled':''}>
          </label>
        </div>
      </td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

          <button type="button" class="btn btn-ghost" id="addCatBtn" style="width:100%;margin-top:4px;">+ Dodaj zadanie</button>
        </div>

        <div class="field">
          <label>Przygotowanie posiłków — ile osób na jeden posiłek (1–6)</label>
          <div class="field-row">
            ${MEAL_TYPES.map(m=>`<div class="field"><label>${m.label}</label><input type="number" min="1" max="6" id="f_need_meal_${m.key}" value="${(c.volunteerSlots['meal_fri_'+m.key]||{needed:2}).needed}"></div>`).join('')}
          </div>
          <p class="course-meta" style="line-height:1.5;">Liczba obowiązuje w piątek, sobotę i niedzielę. Dla każdego dnia jest też 1 koordynator posiłków. Tabele pojawią się w widoku kursu po zapisaniu.</p>
        </div>

        <div class="field">
          <label>Które posiłki odbywają się na kursie?</label>
          <p class="course-meta" style="line-height:1.5;margin-bottom:6px;">Odznacz posiłki, których nie będzie, np. śniadanie i obiad w piątek, jeśli kurs zaczyna się od kolacji. Takie pola znikną z tabeli zapisów.</p>
          <table class="meal-table"><thead><tr><th></th>${MEAL_DAYS.map(d=>`<th>${d.label}</th>`).join('')}</tr></thead><tbody>
            ${MEAL_TYPES.map(m=>`<tr><th>${m.label}</th>${MEAL_DAYS.map(d=>`<td style="vertical-align:middle;"><input type="checkbox" class="meal-check" id="f_meal_on_${d.key}_${m.key}" ${isMealOff(c,`meal_${d.key}_${m.key}`)?'':'checked'}></td>`).join('')}</tr>`).join('')}
          </tbody></table>
        </div>

        <div class="modal-actions">
          <button class="btn btn-ghost" id="modalCancel">Anuluj</button>
          <button class="btn btn-primary" id="modalSaveCourse">Zapisz kurs</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

const MED_QUOTES = [{"t": "Pozostawanie wolnym od lgnięcia jest Mahamudrą.", "a": "Gotzangpa"}, {"t": "Nauczyciel jest zwierciadłem własnego umysłu. Ktoś kto nie jest wyzwolony, nie widzi świata, lecz wyraz własnego umysłu. Każdy, kto widzi dobrego nauczyciela na wysokim poziomie, dowodzi w ten sposób przede wszystkim swego wewnętrznego bogactwa.", "a": "Lama Ole Nydahl"}, {"t": "Praktyka, która przynosi najwięcej pożytku, polega na rozwijaniu zrozumienia, że życie jest tylko iluzją. Wszystko jest jak sen, nic nie jest rzeczywiste.", "a": "Lobpyn Tseczu Rinpocze"}, {"t": "Istotne znaczenie przyjęcia schronienia polega na zaakceptowaniu Buddy, Dharmy i Sangi jako twojego nauczyciela, twojej ścieżki i twoich współtowarzyszy na ścieżce, a następnie na przyrzeczeniu, że osiągnie się ich owoc.", "a": "Guru Rinpocze"}, {"t": "Przeszkadzające uczucia i myśli znikają dzięki brakowi zainteresowania. Jeśli pozwolimy im biec po poboczu istotnych wydarzeń, wkrótce złapią zadyszkę. Nie powinniśmy jednak pozbawiać się przyjemności rzucenia od czasu do czasu okiem na przemykające obok „jazdy”. Obserwowane w ten sposób, ZOO własnych zmiennych emocji uczy nas, jak lepiej pomagać innym. Dzięki temu nastawieniu nasze wewnętrzne tygrysy wyraźnie schudną, a krokodylom wypadną zęby. Przeszkadzające uczucia żywią się jedynie uwagą, ktorą im poświęcamy.", "a": "Lama Ole Nydahl"}, {"t": "Najwyższa radość jest najwyższą prawdą.", "a": "Lama Ole Nydahl"}, {"t": "Wasze szczere oddanie jest najwspanialszym przyjacielem, który przyspiesza kroki na ścieżce.", "a": "Gampopa"}, {"t": "Kiedy umysł doświadcza sam siebie jako nieograniczonego i nieustraszonego, przeżywamy jego naturę buddy.", "a": "Lama Ole Nydahl"}, {"t": "Każde nasze działanie związane jest z nami. Decydujące znaczenie ma zawsze nastawienie, stojące za tym, co robimy.", "a": "Lama Ole Nydahl"}, {"t": "Świat jest po prostu światem spełniającym życzenia.", "a": "Lama Ole Nydahl"}, {"t": "Jeśli spoczywamy świadomie w tym, co jest, nasz umysł staje się przejrzysty i zyskujemy wiele mocy.", "a": "Lama Ole Nydahl"}, {"t": "Nasza codzienna praktyka polega na tym, żebyśmy nigdy nie opuszczali czystej krainy.", "a": "Lama Ole Nydahl"}, {"t": "Dopóki uważamy ciągły strumień myśli, emocji i przeżyć fizycznych za coś rzeczywistego, będą nas one ograniczać. Oceniając wszystko będziemy zasiewać w umyśle przy pomocy myśli, słów i działań określone wrażenia, które spowodują odpowiadające im doświadczenia. Ogólnie doświadczamy przyjemnych przeżyć jako bogactwa, są dla nas podarunkami. Jeśli przychodzi coś monotonnego i „lepkiego”, dzieje się tak najwyraźniej z powodu naszego ograniczonego lub mętnego poglądu. Im więcej pięknych wrażeń nagromadziliśmy w umyśle, tym łatwiej jest nam się rozluźnić. Rozwijamy wtedy pogląd, który spoczywa sam w sobie.", "a": "Lama Ole Nydahl"}, {"t": "Nie zbieramy co prawda w dniu, w którym zasialiśmy, dopóki jednak nie przekształcimy wrażeń nagromadzonych w umyśle dzięki zmianie nastawienia i praktyce medytacji, doświadczymy bez wątpienia rezultatów swych działań.", "a": "Lama Ole Nydahl"}, {"t": "Nasze myśli kształtują nas; stajemy się tym, o czym myślimy. Kiedy umysł jest czysty, radość będzie za nami podążać jak nieodłączny cień.", "a": "Budda"}, {"t": "Prawdziwy rozwój wydarza się poza strefą komfortu.", "a": "Lama Ole Nydahl"}, {"t": "Ten kto przyjmuje wszystko co przykre jako naukę, a wszystko co piękne jako podarunek, może jedynie wygrać.", "a": "Lama Ole Nydahl"}, {"t": "Rozwinięcie bodhiczitty albo oświeconej postawy jest przyczyną przebudzenia. Zasiewa ono w umyśle nasiono, które po dojrzeniu stanie się oświeceniem. Składamy obietnicę bodhisattwy, żeby sformalizować nasze zobowiązanie. Po złożeniu tej obietnicy co jakiś czas przypominamy sobie to nastawienie umysłu i rozwijamy się duchowo. Z życia na życie coraz lepiej udaje nam się przynosić pożytek innym. W końcu urzeczywistnimy ostateczny owoc, czyli pełne i doskonałe przebudzenie, stan buddy.", "a": "XIV Kunzig Szamar Rinpocze"}, {"t": "Jednym z powodów, dla których ludzie są tak bardzo krytyczni, jest ich własna niecierpliwość i pomieszanie, to, że chodzą od jednego nauczyciela do drugiego. Zaczynają wykonywać jedną praktykę, są nią zachwyceni, próbują szybko osiągnąć efekty, jednak w rezultacie nie rozwijają żadnego znaczącego zrozumienia i niczego nie doświadczają. Jak to możliwe? W jaki sposób mogliby czegokolwiek doświadczyć? Udają się więc gdzie indziej i pozostają tam przez krótki czas, mając nadzieję, że natychmiast coś się wydarzy. Jeśli chodzi o prawdziwą ścieżkę i nauki, nie przychodzi to tak łatwo. Potrzeba na to czasu.", "a": "XVI Karmapa Rangdziung Rigpe Dordże"}, {"t": "Postrzegaj wszystkich ludzi na najwyższym poziomie, ale oczekuj czegoś tylko od samego siebie.", "a": "Lama Ole Nydahl"}, {"t": "Nasza jedyna szansa na polepszenie własnej karmy polega na przejęciu odpowiedzialności za własne działania i świadomym zatamowaniu strumienia złych nawyków. Jedynie w ten sposób będziemy w stanie stopniowo wydostać się z bolesnych zakamarków istnienia.", "a": "Lama Ole Nydahl"}, {"t": "Chociaż jest wiele rzek - w morzu i tak staną się on jednym.\nChociaż jest wiele kłamstw - jedna prawda obali je wszystkie.\nKiedy pojawia się jedno słońce, ciemność, choćby była nieprzenikniona, znika.", "a": "Saraha"}, {"t": "Spoczywaj w jedności przejawiania się i pustki, bez podążania za iluzją tego, co się przejawia.\nSpoglądaj na esencję, która nie ma podstawy ani korzenia.\nTen, który widzi i to, co jest widziane są puste.\nPośród tego niepodzielnego zjednoczenia rozgrywa się wielki spektakl pierwotnego, naturalnego stanu.\nOblicze Lamy i mego umysłu są wyraźnie widoczne i jestem pewien, że osiągnę królewską siedzibę wielkiej szczęśliwości.", "a": "XV Karmapa Kacziab Dordże"}, {"t": "Wszystkie rzeczy są w swej naturze umysłem. Ponieważ są umysłem, nie ma niczego, nawet najdrobniejszej rzeczy, jak atom czy pyłek kurzu, która nie miałaby tej samej natury.", "a": "XVI Karmapa Rangdziung Rigpe Dordże"}, {"t": "Życie jest pełne możliwości. Wszystko może nas ekscytować, robić na nas wrażenie, być piękne i stanowić źródło nauki.", "a": "Lama Ole Nydahl"}, {"t": "Żyjemy w ciągłym zagrożeniu ze strony naszych bolesnych emocji: gniewu, przywiązania, dumy, zazdrości itd. Dlatego musimy nieustannie być gotowi zwalczać je właściwą odtrutką. Prawdziwego praktykującego rozpoznać można po jego bezbłędnej przytomności.", "a": "Dilgo Czientse Rinpocze"}, {"t": "Doświadczenie, że przeżywająca przestrzeń jest niezniszczalna, że wyraża się jako nieskończone bogactwo, a jej różnorodności nic nie jest w stanie powstrzymać, niszczy wszelkie oczekiwania i obawy.", "a": "Lama Ole Nydahl"}, {"t": "Miłość i współczucie są właściwą odpowiedzią na krytykę. Jeśli reagujemy gniewem, to zaczynamy zachowywać się tak samo, jak ten, kto nas krytykuje. Takie zachowanie wynika z niewiedzy. Odpowiadanie miłością i współczuciem nie jest łatwe i dlatego właśnie proszę was, abyście takie działanie praktykowali.", "a": "XVII Karmapa Taje Dordże"}, {"t": "Jedyne rzeczy, na które jogin w żadnym wypadku nie może sobie pozwolić, to niedbalstwo, bylejakość, nieprzejrzystość i niepewność. Jest się wówczas jak stary koń, który nie wie czy ma zrobić krok naprzód, czy do tyłu, zostaje więc tam gdzie był i tylko zabiera miejsce. Jogin nie może tego robić. Cokolwiek mamy na celowniku, cokolwiek chcemy zrobić, powinniśmy robić to dobrze, ze świadomością tego co się dzieje, z pełną energią. Wówczas uzyskamy również właściwe rezultaty.", "a": "Lama Ole Nydahl"}, {"t": "Kiedy jesteśmy zadowoleni, kiedy doceniamy wszystko, rzeczy naturalnie układają się na swoim miejscu. Wszystko zaczyna nabierać sensu. Wtedy wszystkie dobre rzeczy w życiu, takie jak komfort i przestrzeń, zaczynają przychodzić naturalnie. To jest prawdziwe bogactwo. I jest ono dostępne dla każdego.", "a": "XVII Karmapa Taje Dordże"}, {"t": "Jeśli świadomie robimy to, co pojawia nam się przed nosem, ze zdumieniem i radością zrozumiemy, że przeszkadzające uczucia nie znikają po prostu, lecz pojawiają się znowu jako mądrości.", "a": "Lama Ole Nydahl"}, {"t": "Jeśli widzisz potęgę góry, jak możesz troszczyć się o kilka krzaków, które na niej rosną?\nJeżeli doświadczasz głębi oceanu, coż może zrobić ci kilka fal?\nJeżeli czujesz moc przeżywającego i dostrzegasz zdolności i bogactwo, które posiadasz, dlaczego uważasz za tak istotne uwarunkowane doświadczenia, które nieustannie odchodzą i przychodzą i robisz z nich wielki problem?", "a": "Milarepa"}, {"t": "Dopóki jesteśmy tutaj jako istoty ludzkie, nie mamy wyboru i musimy angażować się w świat materialny. Mimo tego myślę, że znalezienie równowagi pomiędzy tym światem, a wymiarem duchowym, jest bardzo pożyteczne. Dlatego chcę was prosić, żebyście jak najlepiej wykorzystali wasz czas i wasze życie.", "a": "XVII Karmapa Taje Dordże"}, {"t": "Musisz puścić wolno dokładnie to, do czego się przywiązujesz.", "a": "IX Karmapa Łangczuk Dordże"}, {"t": "Oświecenie jest najintensywniejszym szczęściem, jakie istnieje. To, czego źródłem jest jedynie przestrzeń, nie może ani przeminąć, ani zniknąć.", "a": "Lama Ole Nydahl"}, {"t": "Diamentowa Droga wprowadza najwyższy pogląd do codzienności i prowadzi do rozwinięcia wszystkich zdolności.", "a": "Lama Ole Nydahl"}, {"t": "W Danii nazywa się kochającą się, będącą od dawna razem parę „Dwugłowym Potworem”. Jeśli wszystko jest w porzadku, idziemy naprzód ramię w ramię. Jeżeli pojawiają się trudności, opieramy się o siebie nawzajem plecami. Każde z nas używa swych zdolności dla dobra wszystkich, chronimy się również nawzajem. To pełne zaufania działanie na zasadzie „my”, w przypadku dojrzałych ludzi przekształca długofalowo osobistą wymianę ze światem.", "a": "Lama Ole Nydahl"}, {"t": "Jeśli będziemy w stanie postrzegać wewnętrzne i zewnętrzne wydarzenia jako wzajemnie uwarunkowane i jednocześnie gromadzić w umyśle dobre wrażenia, z pomocą pewnej ilości odwagi osiągniemy wyzwolenie.", "a": "Lama Ole Nydahl"}, {"t": "Skłaniam się przed Dzierżącym Diament (Dordże Czang).\nDla tego, kto pragnie w tym życiu osiągnąć stan Dzierżącego Diament,\nNajwyższą drogą jest droga podążania za autentycznym nauczycielem,\nNajwyższym sposobem okazania szacunku jest okazanie szacunku nauczycielowi.\nNajgłębszą praktyką jest praktyka na nauczyciela,\nNajgłębszym zobowiązaniem jest zobowiązanie wobec nauczyciela,\nNajgłębszym współzależnym powstawaniem, jest najwyższe współzależne powstawanie nauczyciela,\nA spełnieniem rezultatu jest stopienie się z nauczycielem;\nDlatego to na nim powinno się w zręczny sposób oprzeć.", "a": "Tilopa"}, {"t": "Medytuj na promiennego Lamę nad twoją głową jako nieoddzielnego od ciebie.\nMyśl o jego dobroci, nieustannie go przywołuj.\nJeśli udoskonalisz swe oddanie i zmieszasz swój umysł z jego umysłem, osiągniesz cel, chociażby tylko dzięki temu.", "a": "IX Karmapa, Łangczuk Dordże"}];
const MED_GEM = `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#b53a42"/><g fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M17,25 L22,18 L38,18 L43,25 L30,43 Z"/><path d="M17,25 L43,25 M22,18 L26,25 L30,43 M38,18 L34,25 L30,43"/></g></svg>`;
let medUnsub = null, medSeenT = null;

function medRef(){ return doc(db, 'kursZG', 'meditation'); }
function medKey(n){ return norm(n).replace(/[.\/\[\]~*`\s]+/g,'_') || 'anon'; }
function medMe(){ return state.med.users[medKey(state.name)] || null; }
function medDone(u){ return Object.keys((u && u.done) || {}).length; }
function medToday0(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function medParse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function medFmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function medTodayIdx(u){ return Math.round((medToday0() - medParse(u.start)) / MED_DAYMS) + 1; }
function medDateOf(u, i){ return new Date(medParse(u.start).getTime() + (i-1)*MED_DAYMS); }
function medPlDate(d){ return d.toLocaleDateString('pl-PL', {day:'numeric', month:'long'}); }
function medShuffle(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function medQuote(u, i){ const perm = (u.perm && u.perm.length) ? u.perm : MED_QUOTES.map((_,k)=>k); return MED_QUOTES[perm[(i-1) % perm.length]]; }
function medStreak(u){ const t = Math.min(medTodayIdx(u), 30); let i = u.done[t] ? t : t-1, n = 0; while(i>=1 && u.done[i]){ n++; i--; } return n; }
function medTotals(){
  const list = Object.values(state.med.users || {});
  const done = list.reduce((s,u)=>s+medDone(u), 0);
  return { done, points: done*MED_POINTS, people: list.filter(u=>medDone(u)>0).length };
}
function medAgo(t){
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return 'przed chwilą';
  if(m < 60) return m + ' min temu';
  const h = Math.round(m/60); if(h < 24) return h + ' godz. temu';
  return Math.round(h/24) + ' d. temu';
}

function medListen(){
  if(medUnsub) return;
  try{
    medUnsub = onSnapshot(medRef(), snap => {
      const d = snap.exists() ? snap.data() : {};
      state.med.users = d.users || {};
      state.med.feed = d.feed || [];
      const maxT = state.med.feed.reduce((m,e)=>Math.max(m, e.t||0), 0);
      if(medSeenT === null){ medSeenT = maxT; }
      else {
        const fresh = state.med.feed.filter(e => e.t > medSeenT && e.n !== medKey(state.name));
        medSeenT = Math.max(medSeenT, maxT);
        if(state.loggedIn) fresh.slice(-1).forEach(medNotify);
      }
      if(state.loggedIn && !state.loading && state.tab==='med' && !state.modal && !state.catDialog && !state.medPopup) render();
    }, () => {});
  }catch(e){}
}
function medStop(){ if(medUnsub){ try{ medUnsub(); }catch(e){} } medUnsub = null; medSeenT = null; }
function medNotify(e){
  const msg = `${e.name} właśnie medytował(a) — +${MED_POINTS} karma punktów 🌈`;
  document.querySelectorAll('.med-banner').forEach(x=>x.remove());
  const el = document.createElement('div'); el.className = 'med-banner';
  el.innerHTML = `<span style="font-size:1.4rem">🌈</span><span style="flex:1">${escapeHtml(msg)}</span><button class="btn btn-gold" style="padding:7px 11px;font-size:.8rem">Zobacz</button>`;
  el.querySelector('button').onclick = () => { state.tab='med'; el.remove(); render(); };
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 7000);
  try{ if(document.hidden && 'Notification' in window && Notification.permission==='granted') new Notification('KURSY ZG', {body: msg}); }catch(_){}
}

async function medStart(){
  const key = medKey(state.name);
  const u = { name: state.name, start: medFmt(medToday0()), perm: medShuffle(MED_QUOTES.length), done: {} };
  state.med.users[key] = u; render();
  try{ await setDoc(medRef(), { users: { [key]: u } }, { merge: true }); }
  catch(e){ showToast('Nie udało się zapisać. Spróbuj ponownie.'); }
}
async function medMark(day){
  const key = medKey(state.name), u = state.med.users[key];
  if(!u) return;
  if(u.done[day]){
    if(!confirm('Odznaczyć dzień ' + day + '? Stracisz za niego ' + MED_POINTS + ' karma punktów.')) return;
    delete u.done[day]; render();
    try{ await updateDoc(medRef(), { ['users.'+key+'.done.'+day]: deleteField() }); }
    catch(e){ showToast('Nie udało się zapisać. Spróbuj ponownie.'); }
    return;
  }
  const iso = new Date().toISOString();
  const ev = { n: key, name: state.name, d: day, t: Date.now() };
  u.done[day] = iso; state.med.feed = [...state.med.feed, ev];
  state.medPopup = { day, fresh: true }; render();
  try{
    await updateDoc(medRef(), { ['users.'+key+'.done.'+day]: iso, feed: arrayUnion(ev) });
    if(state.med.feed.length > 80) await updateDoc(medRef(), { feed: state.med.feed.slice(-40) });
  }catch(e){ showToast('Nie udało się zapisać. Spróbuj ponownie.'); }
}
async function medReset(){
  const key = medKey(state.name);
  delete state.med.users[key]; render();
  try{ await updateDoc(medRef(), { ['users.'+key]: deleteField() }); }
  catch(e){ showToast('Nie udało się zapisać. Spróbuj ponownie.'); }
}

function renderMedTabs(){
  return `<div class="med-tabs">
    <button class="med-tab ${state.tab!=='med'?'on':''}" data-medtab="kursy">Kursy</button>
    <button class="med-tab ${state.tab==='med'?'on':''}" data-medtab="med">🌈 Wyzwanie 30 dni</button>
  </div>`;
}
function renderMed(){
  const T = medTotals(), u = medMe();
  let h = `<div class="med-photo"><img src="${MED_PHOTO}" alt=""></div><div class="med-card med-total"><small>RAZEM ZEBRALIŚMY</small><div class="big">${T.points.toLocaleString('pl-PL')}</div><small>karma punktów · ${T.done} medytacji · ${T.people} ${T.people===1?'osoba':'osób'}</small></div>`;
  if(!u){
    h += `<div class="med-card med-hero"><h2>Wyzwanie 30 dni medytacji</h2>
      <p class="med-sub">Medytuj codziennie przez 30 dni. Po każdej medytacji zaznacz ją tutaj — dostajesz <b>${MED_POINTS} karma punktów</b> i cytat nauczycieli buddyjskich. Wszystkie punkty zbieramy razem, a sanga dostaje wiadomość, że ktoś właśnie medytował. 🌈</p>
      <button class="btn btn-gold" style="width:100%;padding:14px;" data-medstart>Zaczynam wyzwanie dzisiaj</button></div>`;
  } else {
    const t = medTodayIdx(u), dc = medDone(u), over = t > 30;
    let tb;
    if(dc >= 30) tb = `<h3 class="med-h">Wyzwanie ukończone 🎉</h3><p class="med-sub" style="margin-bottom:0">Wszystkie 30 dni za Tobą. Dotknij kółka, żeby wrócić do cytatu.</p>`;
    else if(t < 1) tb = `<h3 class="med-h">Start wkrótce</h3><p class="med-sub" style="margin-bottom:0">Wyzwanie zaczyna się ${medPlDate(medParse(u.start))}.</p>`;
    else if(!over && u.done[t]) tb = `<h3 class="med-h">Dzisiaj zrobione ✓</h3><p class="med-sub">Dzień ${t} z 30 zaliczony (+${MED_POINTS}). Do zobaczenia jutro!</p><button class="btn btn-ghost" style="width:100%;padding:11px;" data-medread="${t}">Pokaż dzisiejszy cytat</button>`;
    else if(!over) tb = `<h3 class="med-h">Dzień ${t} z 30</h3><p class="med-sub">Po medytacji zaznacz ją tutaj i odbierz ${MED_POINTS} karma punktów oraz cytat na dziś.</p><button class="btn btn-gold" style="width:100%;padding:14px;" data-meddo="${t}">Dzisiaj medytowałem/am ✓</button>`;
    else { const f = [...Array(30).keys()].map(x=>x+1).find(x=>!u.done[x]); tb = `<h3 class="med-h">Zostały dni do nadrobienia</h3><p class="med-sub">Czas wyzwania minął, ale możesz jeszcze zaznaczyć opuszczone dni.</p><button class="btn btn-gold" style="width:100%;padding:14px;" data-meddo="${f}">Zaznacz dzień ${f}</button>`; }
    let g = '';
    for(let i=1;i<=30;i++){
      const dn = !!u.done[i], lock = i>t && !dn;
      g += `<button class="med-day ${dn?'done':''} ${lock?'locked':''} ${i===t&&!dn?'today':''}" data-medday="${i}">${dn ? MED_GEM + '<span class="n">'+i+'</span>' : i}</button>`;
    }
    h += `<div class="med-card"><div class="med-stats">
        <div class="med-stat"><b>${dc*MED_POINTS}</b><span>TWOJE PUNKTY</span></div>
        <div class="med-stat"><b>${dc}/30</b><span>DNI</span></div>
        <div class="med-stat"><b>${medStreak(u)}</b><span>Z RZĘDU</span></div></div>
        <div class="med-bar"><i style="width:${dc/30*100}%"></i></div></div>
      <div class="med-card">${tb}</div>
      <div class="med-card"><h3 class="med-h">Twoje 30 dni</h3><div class="med-grid">${g}</div>
        <p class="med-sub" style="margin:12px 0 0;text-align:center;font-size:.8rem">Dotknij zaliczonego dnia, aby przeczytać jego cytat.</p></div>`;
  }
  const feed = [...state.med.feed].sort((a,b)=>b.t-a.t).slice(0,10);
  h += `<div class="med-card"><h3 class="med-h">Ostatnio w sandze</h3>` + (feed.length
    ? `<ul class="med-feed">${feed.map(e=>`<li><div><b>${escapeHtml(e.name)}</b> medytował(a) · dzień ${e.d} <span style="color:#a8323a;font-weight:700">+${MED_POINTS}</span></div><span>${medAgo(e.t)}</span></li>`).join('')}</ul>`
    : `<p class="med-sub" style="margin:0">Jeszcze nikt nie zaznaczył medytacji. Bądź pierwszy/a!</p>`) + `</div>`;
  if('Notification' in window && Notification.permission === 'default'){
    h += `<button class="btn btn-ghost" style="width:100%;padding:11px;margin-bottom:10px;" data-mednotif>🔔 Powiadamiaj mnie, gdy ktoś medytuje</button>`;
  }
  if(u) h += `<div style="text-align:center"><button class="logout-link" data-medreset>Zacznij wyzwanie od nowa</button></div>`;
  return h;
}
function renderMedPopup(){
  const {day, fresh} = state.medPopup, u = medMe();
  if(!u){ return ''; }
  const q = medQuote(u, day), full = fresh && medDone(u) >= 30, T = medTotals();
  return `<div class="modal-overlay" id="medOv" style="align-items:center;justify-content:center;"><div class="karma-card" style="max-width:380px;width:calc(100% - 32px);max-height:88vh;overflow:auto;">${KARMA_SVG}
    <div class="karma-title">${full ? 'Gratulacje! 30 dni za Tobą!' : (fresh ? 'Brawo! +'+MED_POINTS+' karma punktów!' : 'Cytat z dnia '+day)}</div>
    <div style="font-size:.72rem;letter-spacing:.1em;font-weight:700;color:#8a7f6a">DZIEŃ ${day} · ${medPlDate(medDateOf(u, day)).toUpperCase()}</div>
    <div class="med-quote ${q.t.length>230?'long':''}">${escapeHtml(q.t)}</div><div class="med-author">— ${escapeHtml(q.a)}</div>
    ${fresh ? `<p style="margin:-4px 0 14px;font-size:.85rem;color:#726B5C">Razem zebraliśmy już <b>${T.points.toLocaleString('pl-PL')}</b> karma punktów 🌈</p>` : ''}
    <div class="med-row"><button class="btn btn-ghost" style="flex:1;padding:11px" data-medcopy>Kopiuj</button><button class="btn btn-gold" style="flex:1;padding:11px" data-medclose>Zamknij</button></div></div></div>`;
}
function attachMedEvents(){
  document.querySelectorAll('[data-medtab]').forEach(b=>b.addEventListener('click', ()=>{ state.tab = b.dataset.medtab; render(); }));
  document.querySelectorAll('[data-medstart]').forEach(b=>b.addEventListener('click', medStart));
  document.querySelectorAll('[data-meddo]').forEach(b=>b.addEventListener('click', ()=>medMark(+b.dataset.meddo)));
  document.querySelectorAll('[data-medread]').forEach(b=>b.addEventListener('click', ()=>{ state.medPopup = {day:+b.dataset.medread, fresh:false}; render(); }));
  document.querySelectorAll('[data-medday]').forEach(b=>b.addEventListener('click', ()=>{
    const i = +b.dataset.medday, u = medMe(); if(!u) return;
    if(u.done[i]){ state.medPopup = {day:i, fresh:false}; render(); }
    else if(i <= medTodayIdx(u)) medMark(i);
  }));
  document.querySelectorAll('[data-medreset]').forEach(b=>b.addEventListener('click', ()=>{ if(confirm('Usunąć Twój postęp i zacząć od nowa? Stracisz zebrane punkty.')) medReset(); }));
  document.querySelectorAll('[data-mednotif]').forEach(b=>b.addEventListener('click', async ()=>{ try{ await Notification.requestPermission(); }catch(_){} render(); }));
  const ov = document.getElementById('medOv');
  if(ov){
    ov.addEventListener('click', e=>{
      if(e.target === ov || e.target.closest('[data-medclose]')){ state.medPopup = null; render(); }
      const c = e.target.closest('[data-medcopy]');
      if(c){ const u = medMe(), q = medQuote(u, state.medPopup.day); try{ navigator.clipboard.writeText('„'+q.t+'” — '+q.a); c.textContent = 'Skopiowano ✓'; }catch(_){} }
    });
  }
}

function attachEvents(){
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', logout);

  document.querySelectorAll('.course-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      state.selectedCourseId = card.dataset.course;
      render();
    });
  });

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.selectedCourseId=null; render(); });

  const fabAdd = document.getElementById('fabAdd');
  if(fabAdd) fabAdd.addEventListener('click', ()=>{
    state.editingCourse = { id:uid(), title:'', dateStart:'', dateEnd:'', aktualnosci:'', teacherPhoto:'', mealsOff:[], customCats:[], tasks: ORG_CATS.map(c=>({key:c.key,label:c.label})), program:'', coordinatorMeals:'', volunteerSlots: emptyVolunteer() };
    state.modal = 'addCourse';
    render();
  });

  const pdfCourseBtn = document.getElementById('pdfCourseBtn');
  if(pdfCourseBtn) pdfCourseBtn.addEventListener('click', ()=>{
    const course = state.courses.find(c=>c.id===state.selectedCourseId);
    if(course) openCoursePdf(course);
  });

  const editCourseBtn = document.getElementById('editCourseBtn');
  if(editCourseBtn) editCourseBtn.addEventListener('click', ()=>{
    const course = state.courses.find(c=>c.id===state.selectedCourseId);
    state.editingCourse = JSON.parse(JSON.stringify(course));
    state.modal = 'editCourse';
    render();
  });

  const deleteCourseBtn = document.getElementById('deleteCourseBtn');
  if(deleteCourseBtn) deleteCourseBtn.addEventListener('click', async ()=>{
    if(!confirm('Na pewno usunąć ten kurs?')) return;
    state.courses = state.courses.filter(c=>c.id!==state.selectedCourseId);
    state.selectedCourseId = null;
    await saveCourses();
    render();
    showToast('Kurs usunięty.');
  });

  document.querySelectorAll('[data-vol-toggle]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const course = state.courses.find(c=>c.id===state.selectedCourseId);
      const key = cb.dataset.volToggle;
      const v = course.volunteerSlots[key];
      const already = v.people.some(p=>norm(p)===norm(state.name));
      if(already){
        v.people = v.people.filter(p=>norm(p)!==norm(state.name));
      } else {
        if(v.people.length >= v.needed){ render(); return; }
        v.people.push(state.name);
      }
      await saveCourses();
      render();
      if(already) showToast('Wypisano.');
      if(!already){
        state.karma = true;
        const isMeal = key.startsWith('meal_');
        if(key==='room' || key==='shopping' || isMeal){
          const vsl = course.volunteerSlots;
          const peopleOf = k => ((vsl[k]||{}).people||[]);
          let list;
          if(key==='room') list = peopleOf('coord_course');
          else if(isMeal) list = peopleOf(`coord_meals_${key.split('_')[1]}`);
          else list = MEAL_DAYS.flatMap(d=>peopleOf(`coord_meals_${d.key}`));
          const coords = [...new Set(list)].filter(n=>norm(n)!==norm(state.name));
          if(coords.length) state.notice = 'Dzięki, skontaktuj się z ' + coords.map(instrName).join(' lub ') + '.';
          else if(key==='room') state.notice = 'Super, skontaktuj się z koordynatorem kursu.';
          else state.notice = 'Super, skontaktuj się z koordynatorem posiłków tego dnia.';
        }
        render();
      }
    });
  });

  document.querySelectorAll('[data-remove-vol]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const course = state.courses.find(c=>c.id===state.selectedCourseId);
      const cat = btn.dataset.removeVol;
      const nameToRemove = btn.dataset.removeName;
      const v = course.volunteerSlots[cat];
      v.people = v.people.filter(p=>norm(p)!==norm(nameToRemove));
      await saveCourses();
      render();
    });
  });

  // modal generic
  const overlay = document.getElementById('modalOverlay');
  if(overlay){
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ state.modal=null; render(); } });
  }
  const cancelBtn = document.getElementById('modalCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.modal=null; render(); });

  const addCatBtn = document.getElementById('addCatBtn');
  if(addCatBtn) addCatBtn.addEventListener('click', ()=>{ collectCourseFormIntoState(); state.catDialog = true; render(); setTimeout(()=>{ const e=document.getElementById('cat_name'); if(e && !(document.activeElement && document.activeElement.closest('#catOverlay'))) e.focus(); },50); });
  const catCancel = document.getElementById('catCancel');
  if(catCancel) catCancel.addEventListener('click', ()=>{ state.catDialog = false; render(); });
  const catAdd = document.getElementById('catAdd');
  if(catAdd) catAdd.addEventListener('click', ()=>{
    const name = document.getElementById('cat_name').value.trim();
    const n = Math.min(10, Math.max(1, parseInt(document.getElementById('cat_needed').value,10) || 1));
    if(!name){ showToast('Wpisz nazwę zadania.'); return; }
    const c = state.editingCourse;
    const key = 'custom_' + uid();
    c.tasks = c.tasks || [];
    c.tasks.push({ key, label: name });
    c.volunteerSlots[key] = { needed: n, people: [] };
    state.catDialog = false;
    render();
  });
  document.querySelectorAll('[data-del-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      collectCourseFormIntoState();
      const c = state.editingCourse, key = btn.dataset.delCat;
      const slot = c.volunteerSlots[key];
      if(slot && slot.people.length && !confirm('W tej kategorii są już zapisane osoby. Usunąć kategorię razem z zapisami?')) return;
      c.tasks = (c.tasks||[]).filter(x=>x.key!==key);
      delete c.volunteerSlots[key];
      render();
    });
  });
  const noticeOk = document.getElementById('noticeOk');
  if(noticeOk) noticeOk.addEventListener('click', ()=>{ state.notice=''; state.karma=false; render(); });
  const photoInput = document.getElementById('f_photo');
  if(photoInput) photoInput.addEventListener('change', ()=>{
    const file = photoInput.files && photoInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const S = 300;
        const side = Math.min(img.width, img.height);
        const cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        cv.getContext('2d').drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
        collectCourseFormIntoState();
        state.editingCourse.teacherPhoto = cv.toDataURL('image/jpeg', 0.75);
        render();
      };
      img.onerror = ()=> showToast('Nie udało się wczytać zdjęcia.');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  const photoRemove = document.getElementById('f_photo_remove');
  if(photoRemove) photoRemove.addEventListener('click', ()=>{
    collectCourseFormIntoState();
    state.editingCourse.teacherPhoto = '';
    render();
  });

  const saveCourseBtn = document.getElementById('modalSaveCourse');
  if(saveCourseBtn) saveCourseBtn.addEventListener('click', async ()=>{
    collectCourseFormIntoState();
    const c = state.editingCourse;
    if(!c.title.trim()){ showToast('Podaj tytuł kursu.'); return; }
    if(!c.dateStart){ showToast('Podaj datę rozpoczęcia.'); return; }
    if(!c.dateEnd) c.dateEnd = c.dateStart;
    const idx = state.courses.findIndex(x=>x.id===c.id);
    if(idx>=0) state.courses[idx] = c; else state.courses.push(c);
    state.modal = null;
    await saveCourses();
    render();
    showToast('Kurs zapisany.');
  });

}

function collectCourseFormIntoState(){
  const c = state.editingCourse;
  c.title = document.getElementById('f_title').value;
  c.dateStart = document.getElementById('f_dateStart').value;
  c.dateEnd = document.getElementById('f_dateEnd').value;
  c.aktualnosci = document.getElementById('f_aktualnosci').value;
  c.program = document.getElementById('f_program').value;
  const coordEl = document.getElementById('f_need_coord_course');
  if(coordEl) c.volunteerSlots.coord_course.needed = Math.min(2, Math.max(1, parseInt(coordEl.value,10) || 1));
  MEAL_TYPES.forEach(m=>{
    const el = document.getElementById('f_need_meal_'+m.key);
    if(!el) return;
    const n = Math.min(6, Math.max(1, parseInt(el.value,10) || 2));
    MEAL_DAYS.forEach(d=>{ const sl = c.volunteerSlots[`meal_${d.key}_${m.key}`]; if(sl) sl.needed = n; });
  });
  if(document.getElementById(`f_meal_on_${MEAL_DAYS[0].key}_${MEAL_TYPES[0].key}`)){
    c.mealsOff = [];
    MEAL_DAYS.forEach(d=>MEAL_TYPES.forEach(m=>{
      const el = document.getElementById(`f_meal_on_${d.key}_${m.key}`);
      if(el && !el.checked) c.mealsOff.push(`meal_${d.key}_${m.key}`);
    }));
  }
  (c.tasks||[]).forEach(t=>{
    const lb = document.getElementById('f_task_label_'+t.key);
    if(lb && lb.value.trim()) t.label = lb.value.trim();
    const el = document.getElementById('f_need_'+t.key);
    if(el && c.volunteerSlots[t.key]) c.volunteerSlots[t.key].needed = Math.min(10, Math.max(1, parseInt(el.value,10) || 1));
  });
}

render();
</script>
</body>
</html>
