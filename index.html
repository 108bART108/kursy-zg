<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KURSY ZG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   USTAWIENIA DO ZMIANY PRZEZ ADMINA — patrz sekcja <script> niżej:
   ADMIN_NAMES  -> lista imion trzech administratorów
   APP_PASSWORD -> hasło wejściowe do aplikacji
   ============================================================ */

:root{
  --bg:#FFFFFF;
  --bg-card:#FFFFFF;
  --bg-alt:#F1EAD9;
  --ink:#2B2A26;
  --ink-soft:#726B5C;
  --ink-faint:#A79F8C;
  --indigo:#33415C;
  --indigo-deep:#212C40;
  --gold:#B8873F;
  --gold-soft:#E9D9BC;
  --moss:#6B7D5B;
  --ochre:#C17817;
  --line:#E7DFCB;
  --radius:14px;
  --shadow:0 1px 2px rgba(43,42,38,0.04), 0 4px 16px rgba(43,42,38,0.06);
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--indigo-deep);
}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--gold-soft);}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:32px;
  position:relative;
}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  max-width:560px;
  margin:0 auto;
  background:#3A2E22;
}
.login-photo-wrap{
  width:100%;
  position:relative;
  line-height:0;
  flex-shrink:0;
}
.login-photo-img{
  width:100%;
  height:auto;
  display:block;
}
.login-photo-wrap::after{
  content:'';
  position:absolute; left:0; right:0; bottom:0; height:110px;
  background: linear-gradient(180deg, rgba(58,46,34,0) 0%, #3A2E22 100%);
}
.login-content{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:14px 24px 32px;
  margin-top:-30px;
  position:relative;
  z-index:1;
}
.login-logo-plaque{
  background:#fff;
  border-radius:14px;
  padding:16px 22px;
  box-shadow:0 8px 28px rgba(0,0,0,0.35);
  margin-bottom:26px;
}
.login-logo{
  width:100%;
  max-width:230px;
  height:auto;
  display:block;
}
.login-wrap h1{
  font-family:'Inter',sans-serif;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.03em;
  font-size:1.6rem;
  margin:0 0 4px;
  text-align:center;
  color:#F3E9D8;
}
.login-sub{color:rgba(243,233,216,0.78);font-size:0.95rem;margin:0 0 32px;text-align:center;line-height:1.5;}
.field{width:100%;margin-bottom:14px;}
.field label{display:block;font-size:0.8rem;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
.login-wrap .field label{color:rgba(243,233,216,0.78);}
.field input, .field textarea{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:var(--bg-card);
  font-size:1rem;
  color:var(--ink);
  outline:none;
  transition:border-color .15s;
}
.field input:focus, .field textarea:focus{border-color:var(--indigo);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;
  border-radius:10px;
  border:none;
  font-size:0.95rem;
  font-weight:600;
  transition:transform .1s, opacity .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--indigo);color:#fff;width:100%;padding:13px;}
.btn-primary:hover{background:var(--indigo-deep);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--line);}
.btn-danger{background:transparent;color:#B4432F;}
.btn-sm{padding:8px 14px;font-size:0.85rem;}
.error-msg{color:#FF8A70;font-size:0.85rem;margin:-6px 0 12px;text-align:center;}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
.topbar-logo{height:24px;width:auto;}
.topbar h1{font-size:1.15rem;margin:0;}
.user-chip{
  font-size:0.78rem;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}
.admin-badge{
  background:var(--gold-soft);color:#7A5A20;
  padding:2px 8px;border-radius:20px;font-size:0.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
}
.logout-link{background:none;border:none;color:var(--ink-faint);font-size:0.78rem;text-decoration:underline;padding:0;}

/* ---------- Content ---------- */
.content{padding:20px;}
.section-title{
  font-size:0.78rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-faint);font-weight:700;margin:0 0 14px;
}
.empty-state{
  text-align:center;padding:56px 20px;color:var(--ink-soft);
}
.empty-state .em-mark{
  width:36px;height:36px;margin:0 auto 14px;border-radius:50%;
  border:1.5px dashed var(--gold);
}
.empty-state p{font-size:0.92rem;line-height:1.6;margin:0;}

/* ---------- Course cards ---------- */
.course-card{
  background:var(--bg-card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:14px;
  cursor:pointer;
  border:1px solid var(--line);
  transition:transform .12s, box-shadow .12s;
}
.course-card:active{transform:scale(0.99);}
.course-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.date-badge{
  flex-shrink:0;
  background:var(--indigo);color:#fff;
  border-radius:10px;
  padding:8px 10px;
  text-align:center;
  min-width:52px;
}
.date-badge .d{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:600;line-height:1;}
.date-badge .m{font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85;}
.course-card h3{font-size:1.05rem;margin:0 0 3px;}
.teacher-thumb{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--gold);background:#eee;}
.coord-summary{background:#fff;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.92rem;line-height:1.6;}
.coord-summary b{color:#7A5A20;}
.detail-head-row{display:flex;align-items:center;gap:14px;}
.detail-head-row>div{flex:1;min-width:0;}
.teacher-photo-lg{width:84px;height:84px;border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid var(--gold);}
.photo-edit{display:flex;align-items:center;gap:12px;}
.photo-edit .btn-mini{font-size:.8rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
.course-meta{font-size:0.82rem;color:var(--ink-soft);margin:0;}
.course-card-foot{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.fill-summary{font-size:0.78rem;color:var(--ink-soft);}
.fill-summary strong{color:var(--moss);}
.fill-summary.needs strong{color:var(--ochre);}
.chevron{color:var(--ink-faint);font-size:1.1rem;}

/* ---------- Detail view ---------- */
.detail-back{
  background:none;border:none;color:var(--indigo);font-size:0.88rem;font-weight:600;
  display:flex;align-items:center;gap:5px;padding:0 0 18px;
}
.detail-header h2{font-size:1.5rem;margin:0 0 6px;}
.detail-meta-row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:0.86rem;color:var(--ink-soft);margin-bottom:20px;}
.detail-meta-row span{display:flex;align-items:center;gap:5px;}
.detail-block{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;
}
.detail-block h4{
  font-size:0.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);
  margin:0 0 10px;font-weight:700;font-family:'Inter',sans-serif;
}
.detail-block p{font-size:0.92rem;line-height:1.65;margin:0;white-space:pre-wrap;color:var(--ink);}
.aktualnosci-block{background:var(--gold-soft);border-color:var(--gold);}
.aktualnosci-block h4{color:#7A5A20;}
.teacher-name{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;color:var(--indigo-deep);margin:0 0 6px;}

/* ---------- Volunteer / beads ---------- */
.vol-category{padding:14px 0;border-bottom:1px solid var(--line);}
.vol-category:last-child{border-bottom:none;}
.vol-cat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.vol-cat-name{font-weight:600;font-size:0.94rem;}
.vol-cat-count{font-size:0.78rem;color:var(--ink-soft);}
.beads{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.bead{
  width:15px;height:15px;border-radius:50%;
  border:1.5px solid var(--gold);
  background:transparent;
  transition:background .2s;
}
.bead.filled{background:var(--gold);}
.vol-names{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.name-chip{
  background:var(--bg-alt);color:var(--ink);
  padding:4px 10px;border-radius:20px;font-size:0.8rem;
  display:flex;align-items:center;gap:6px;
}
.name-chip button{background:none;border:none;color:var(--ink-faint);font-size:0.85rem;line-height:1;padding:0;}
.vol-cat-actions{display:flex;gap:8px;flex-wrap:wrap;}
.check-row{display:flex;align-items:center;gap:9px;font-size:0.88rem;color:var(--ink);cursor:pointer;}
.check-row input[type="checkbox"]{width:19px;height:19px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;}
.meal-table{width:100%;border-collapse:collapse;font-size:0.78rem;table-layout:fixed;margin-top:2px;}
.meal-table th,.meal-table td{border:1px solid var(--line);padding:6px 4px;text-align:center;vertical-align:top;}
.meal-table thead th{
  background:var(--bg-alt);color:var(--indigo-deep);font-weight:700;
  font-size:0.7rem;text-transform:uppercase;letter-spacing:.03em;padding:8px 4px;
}
.meal-table tbody th{
  background:var(--bg-alt);color:var(--ink);font-weight:600;text-align:left;
  padding-left:8px;font-size:0.78rem;white-space:nowrap;
}
.meal-table th:first-child, .meal-table td:first-child{width:74px;}
.meal-coord-row th, .meal-coord-row td{background:#FBF6EA;}
.meal-coord-row th{color:#7A5A20;}
.meal-cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:34px;justify-content:center;}
.meal-cell-count{font-size:0.66rem;color:var(--ink-soft);}
.meal-cell-names{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;}
.name-chip-sm{
  background:#fff;color:var(--ink);border:1px solid var(--line);
  padding:1px 5px;border-radius:9px;font-size:0.63rem;
  display:flex;align-items:center;gap:2px;
}
.name-chip-sm button{background:none;border:none;color:var(--ink-faint);font-size:0.7rem;line-height:1;padding:0;}
.meal-check-wrap{display:flex;}
.meal-check{width:17px;height:17px;accent-color:var(--gold);cursor:pointer;}

/* ---------- Notes / timeline ---------- */
.timeline{position:relative;padding-left:22px;}
.timeline::before{
  content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;
  background:linear-gradient(var(--gold) 0%, var(--line) 100%);
}
.note-item{position:relative;margin-bottom:22px;}
.note-item::before{
  content:'';position:absolute;left:-22px;top:4px;
  width:11px;height:11px;border-radius:50%;background:var(--gold);
  border:2px solid var(--bg);
}
.note-date{font-size:0.76rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.note-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;
}
.note-author{font-weight:600;font-size:0.86rem;color:var(--indigo-deep);margin-bottom:4px;}
.note-content{font-size:0.9rem;line-height:1.6;white-space:pre-wrap;color:var(--ink);}
.note-actions{display:flex;gap:12px;margin-top:8px;}
.note-actions button{background:none;border:none;font-size:0.76rem;color:var(--ink-faint);padding:0;text-decoration:underline;}

.fab{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));
  right:max(20px, calc((100vw - 560px) / 2 + 20px));
  width:52px;height:52px;border-radius:50%;
  background:var(--indigo);color:#fff;border:none;
  font-size:1.5rem;box-shadow:0 4px 14px rgba(33,44,64,0.35);
  z-index:19;
  display:flex;align-items:center;justify-content:center;
}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(33,28,20,0.45);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:var(--bg);width:100%;max-width:560px;
  max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;
  padding:22px 20px calc(28px + env(safe-area-inset-bottom));
  animation:slideUp .22s ease-out;
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 18px;}
.modal-sheet h2{font-size:1.25rem;margin:0 0 18px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.vol-needs-grid{display:flex;flex-wrap:wrap;gap:10px;}
.vol-needs-grid .field{flex:1 1 130px;margin-bottom:0;}
.remove-row-btn{background:none;border:none;color:var(--ink-faint);font-size:1.1rem;padding:4px 8px;flex-shrink:0;}
.add-row-link{background:none;border:none;color:var(--indigo);font-size:0.85rem;font-weight:600;padding:6px 0;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--indigo-deep);color:#fff;padding:10px 18px;border-radius:30px;
  font-size:0.84rem;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,0.2);
  animation:fadeInUp .2s ease-out;
}
@keyframes fadeInUp{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);font-size:0.9rem;}
</style>

<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ============================================================
   FIREBASE — baza danych, w której zapisują się kursy
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBk2ctL5hhMNKs7PrYrOb8EJZVgmFk0xqM",
  authDomain: "kursy-zg.firebaseapp.com",
  projectId: "kursy-zg",
  storageBucket: "kursy-zg.firebasestorage.app",
  messagingSenderId: "68666001211",
  appId: "1:68666001211:web:3cea87527cec762fff991e"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* ============================================================
   KONFIGURACJA — edytuj poniższe wartości
   ============================================================ */
// Administratorem zostaje każdy, kto wpisze imię zakończone cyframi 108 (np. Ania108)
const ADMIN_SUFFIX = '108';
const APP_PASSWORD = 'sangha2026';                // wspólne hasło wejściowe — zmień je!

/* ============================================================
   STAN APLIKACJI
   ============================================================ */
let state = {
  loggedIn: false,
  name: '',
  isAdmin: false,
  loading: true,
  selectedCourseId: null,
  modal: null,        // 'addCourse' | 'editCourse' | 'addNote' | 'editNote'
  editingCourse: null,
  courses: [],
  loginError: '',
  toastMsg: '',
  notice: ''
};

const ORG_CATS = [
  { key:'room', label:'Przygotowanie pokoju dla nauczyciela' },
  { key:'shopping', label:'Zakupy na posiłki' }
];
const MEAL_DAYS = [
  { key:'fri', label:'Piątek' },
  { key:'sat', label:'Sobota' },
  { key:'sun', label:'Niedziela' }
];
const MEAL_TYPES = [
  { key:'breakfast', label:'Śniadanie' },
  { key:'lunch', label:'Obiad' },
  { key:'dinner', label:'Kolacja' }
];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function norm(s){ return (s||'').trim().toLowerCase(); }

function emptyVolunteer(){
  const v = {};
  v.coord_course = { needed: 1, people: [] };
  MEAL_DAYS.forEach(day => { v[`coord_meals_${day.key}`] = { needed: 1, people: [] }; });
  ORG_CATS.forEach(c => v[c.key] = { needed: 2, people: [] });
  MEAL_DAYS.forEach(day=>{
    MEAL_TYPES.forEach(meal=>{
      v[`meal_${day.key}_${meal.key}`] = { needed: 2, people: [] };
    });
  });
  return v;
}

/* ============================================================
   STORAGE
   ============================================================ */
async function loadAll(){
  try{
    const snap = await getDoc(doc(db, 'kursZG', 'courses'));
    state.courses = snap.exists() ? (snap.data().list || []) : [];
    // zabezpieczenie dla kursów zapisanych przed zmianami w strukturze
    state.courses.forEach(course => {
      if(course.aktualnosci === undefined) course.aktualnosci = '';
      if(course.teacherPhoto === undefined) course.teacherPhoto = '';
      if(course.coordinatorMeals === undefined) course.coordinatorMeals = '';
      course.volunteerSlots = Object.assign(emptyVolunteer(), course.volunteerSlots || {});
      // dawny wpis tekstowy "koordynator kursu" -> zapis w nowym polu zgłoszeń
      if(course.coordinatorAll && course.volunteerSlots.coord_course.people.length === 0){
        course.volunteerSlots.coord_course.people.push(course.coordinatorAll);
      }
      course.coordinatorAll = '';
    });
  }catch(e){ state.courses = []; showToast('Nie udało się wczytać danych z bazy.'); }
  state.loading = false;
  render();
}

async function saveCourses(){
  try{
    await setDoc(doc(db, 'kursZG', 'courses'), { list: state.courses });
  }catch(e){ showToast('Nie udało się zapisać. Spróbuj ponownie.'); }
}

/* Odmiana imienia w narzędniku (z kim?) — Bartek → Bartkiem, Ania → Anią */
function instrWord(w){
  const lw = w.toLowerCase();
  const cut = (n, add) => w.slice(0, w.length-n) + add;
  if(/(ski|cki|dzki)$/.test(lw)) return cut(1,'im');
  if(/(ska|cka|dzka)$/.test(lw)) return cut(1,'ą');
  if(/[^aeiouyąęó]eł$/.test(lw)) return cut(2,'łem');
  if(/[^aeiouyąęó]ek$/.test(lw)) return cut(2,'kiem');
  if(/[kg]$/.test(lw)) return w + 'iem';
  if(/a$/.test(lw)) return cut(1,'ą');
  if(/[iy]$/.test(lw)) return w + 'm';
  if(/o$/.test(lw)) return w + 'em';
  if(/e$/.test(lw)) return w;
  return w + 'em';
}
function instrName(full){
  return String(full).trim().split(/\s+/).map(x=>x.replace(/\d+$/,'')).filter(Boolean).map(instrWord).join(' ');
}

function showToast(msg){
  state.toastMsg = msg;
  render();
  setTimeout(()=>{ state.toastMsg=''; render(); }, 2200);
}

/* ============================================================
   ZAPAMIĘTYWANIE LOGOWANIA (na tym urządzeniu/przeglądarce)
   ============================================================ */
const REMEMBER_KEY = 'kurszg_remember';
function getSavedLogin(){
  try{
    const raw = localStorage.getItem(REMEMBER_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveLogin(name, password){
  try{ localStorage.setItem(REMEMBER_KEY, JSON.stringify({name, password})); }catch(e){}
}
function clearSavedLogin(){
  try{ localStorage.removeItem(REMEMBER_KEY); }catch(e){}
}

/* ============================================================
   LOGIN
   ============================================================ */
function attemptLogin(name, password, remember){
  if(!name.trim()){ state.loginError = 'Podaj imię.'; render(); return; }
  if(password !== APP_PASSWORD){ state.loginError = 'Błędne hasło.'; render(); return; }
  state.loggedIn = true;
  state.name = name.trim();
  state.isAdmin = norm(state.name).length > ADMIN_SUFFIX.length && norm(state.name).endsWith(ADMIN_SUFFIX);
  state.loginError = '';
  if(remember){ saveLogin(state.name, password); } else { clearSavedLogin(); }
  render();
  loadAll();
}
function logout(){
  state = { ...state, loggedIn:false, name:'', isAdmin:false, tab:'kursy', selectedCourseId:null, modal:null };
  render();
}

/* ============================================================
   HELPERS: daty
   ============================================================ */
const MIESIACE = ['STY','LUT','MAR','KWI','MAJ','CZE','LIP','SIE','WRZ','PAŹ','LIS','GRU'];
function fmtBadge(dateStr){
  if(!dateStr) return {d:'--', m:''};
  const d = new Date(dateStr+'T00:00:00');
  return { d: d.getDate(), m: MIESIACE[d.getMonth()] };
}
function fmtLong(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const dni = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
  return `${d.getDate()} ${['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'][d.getMonth()]} ${d.getFullYear()}`;
}
function volunteerTotals(course){
  let needed=0, filled=0;
  Object.keys(course.volunteerSlots).forEach(key=>{
    const v = course.volunteerSlots[key];
    needed += v.needed;
    filled += Math.min(v.people.length, v.needed);
  });
  return {needed, filled};
}

function render(){
  const app = document.getElementById('app');
  if(!state.loggedIn){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }

  let html = renderTopbar();
  html += '<div class="content">';
  html += state.selectedCourseId ? renderCourseDetail() : renderCourseList();
  html += '</div>';
  if(!state.selectedCourseId && state.isAdmin){
    html += `<button class="fab" id="fabAdd" title="Dodaj kurs">+</button>`;
  }
  if(state.modal) html += renderModal();
  if(state.notice) html += `<div class="modal-overlay" id="noticeOverlay" style="align-items:center;justify-content:center;"><div style="background:#fff;border-radius:16px;padding:24px 22px;max-width:320px;margin:0 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);"><div style="font-size:2rem;">🙏</div><p style="font-size:1.05rem;line-height:1.45;margin:10px 0 18px;">${escapeHtml(state.notice)}</p><button class="btn btn-gold" style="width:100%;padding:12px;" id="noticeOk">OK</button></div></div>`;
  if(state.toastMsg) html += `<div class="toast">${escapeHtml(state.toastMsg)}</div>`;

  app.innerHTML = html;
  attachEvents();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;
}

/* ---------- Pojedyncza kategoria dyżuru (checkbox dla zalogowanych) ---------- */
function renderVolCategory(key, label, v){
  const already = v.people.some(p=>norm(p)===norm(state.name));
  const full = v.people.length >= v.needed;
  let beads = '';
  for(let i=0;i<v.needed;i++){
    beads += `<div class="bead ${i < v.people.length ? 'filled':''}"></div>`;
  }
  return `
  <div class="vol-category">
    <div class="vol-cat-top">
      <span class="vol-cat-name">${label}</span>
      <span class="vol-cat-count">${v.people.length}/${v.needed}</span>
    </div>
    <div class="beads">${beads}</div>
    <div class="vol-names">
      ${v.people.map(p=>`<span class="name-chip">${escapeHtml(p)}${(state.isAdmin || norm(p)===norm(state.name)) ? `<button data-remove-vol="${key}" data-remove-name="${escapeHtml(p)}">×</button>`:''}</span>`).join('')}
    </div>
    <label class="check-row">
      <input type="checkbox" data-vol-toggle="${key}" ${already?'checked':''} ${(!already && full)?'disabled':''}>
      <span>${already ? 'Zgłoszono — odznacz, aby się wypisać' : (full ? 'Komplet' : 'Zgłaszam się')}</span>
    </label>
  </div>`;
}

/* ---------- Tabela posiłków (dni x posiłki) ---------- */
const COORD_ROWS = [{ label:'Koordynator', keyFor: day => `coord_meals_${day.key}`, coord:true }];
const MEAL_ROWS = MEAL_TYPES.map(meal => ({ label: meal.label, keyFor: day => `meal_${day.key}_${meal.key}` }));

function renderMealTable(course, rows){
  let html = `<table class="meal-table"><thead><tr><th></th>${MEAL_DAYS.map(d=>`<th>${d.label}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(row=>{
    html += `<tr class="${row.coord ? 'meal-coord-row' : ''}"><th>${row.label}</th>`;
    MEAL_DAYS.forEach(day=>{
      const key = row.keyFor(day);
      const v = course.volunteerSlots[key];
      const already = v.people.some(p=>norm(p)===norm(state.name));
      const full = v.people.length >= v.needed;
      html += `<td>
        <div class="meal-cell">
          <span class="meal-cell-count">${v.people.length}/${v.needed}</span>
          ${v.people.length ? `<div class="meal-cell-names">${v.people.map(p=>`<span class="name-chip-sm">${escapeHtml(p)}${(state.isAdmin || norm(p)===norm(state.name)) ? `<button data-remove-vol="${key}" data-remove-name="${escapeHtml(p)}">×</button>` : ''}</span>`).join('')}</div>` : ''}
          <label class="meal-check-wrap" title="${already ? 'Wypisz się' : 'Zgłoś się'}">
            <input type="checkbox" class="meal-check" data-vol-toggle="${key}" ${already?'checked':''} ${(!already && full)?'disabled':''}>
          </label>
        </div>
      </td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

/* ============================================================
   EVENTS
   ============================================================ */
function attachEvents(){
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', logout);

  document.querySelectorAll('.course-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      state.selectedCourseId = card.dataset.course;
      render();
    });
  });

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.selectedCourseId=null; render(); });

  const fabAdd = document.getElementById('fabAdd');
  if(fabAdd) fabAdd.addEventListener('click', ()=>{
    state.editingCourse = { id:uid(), title:'', dateStart:'', dateEnd:'', aktualnosci:'', teacherPhoto:'', program:'', coordinatorMeals:'', volunteerSlots: emptyVolunteer() };
    state.modal = 'addCourse';
    render();
  });

  const editCourseBtn = document.getElementById('editCourseBtn');
  if(editCourseBtn) editCourseBtn.addEventListener('click', ()=>{
    const course = state.courses.find(c=>c.id===state.selectedCourseId);
    state.editingCourse = JSON.parse(JSON.stringify(course));
    state.modal = 'editCourse';
    render();
  });

  const deleteCourseBtn = document.getElementById('deleteCourseBtn');
  if(deleteCourseBtn) deleteCourseBtn.addEventListener('click', async ()=>{
    if(!confirm('Na pewno usunąć ten kurs?')) return;
    state.courses = state.courses.filter(c=>c.id!==state.selectedCourseId);
    state.selectedCourseId = null;
    await saveCourses();
    render();
    showToast('Kurs usunięty.');
  });

  document.querySelectorAll('[data-vol-toggle]').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const course = state.courses.find(c=>c.id===state.selectedCourseId);
      const key = cb.dataset.volToggle;
      const v = course.volunteerSlots[key];
      const already = v.people.some(p=>norm(p)===norm(state.name));
      if(already){
        v.people = v.people.filter(p=>norm(p)!==norm(state.name));
      } else {
        if(v.people.length >= v.needed){ render(); return; }
        v.people.push(state.name);
      }
      await saveCourses();
      render();
      showToast(already ? 'Wypisano.' : 'Zapisano — dziękujemy!');
      if(!already){
        const isMeal = key.startsWith('meal_');
        if(key==='room' || key==='shopping' || isMeal){
          const vsl = course.volunteerSlots;
          const peopleOf = k => ((vsl[k]||{}).people||[]);
          let list;
          if(key==='room') list = peopleOf('coord_course');
          else if(isMeal) list = peopleOf(`coord_meals_${key.split('_')[1]}`);
          else list = MEAL_DAYS.flatMap(d=>peopleOf(`coord_meals_${d.key}`));
          const coords = [...new Set(list)].filter(n=>norm(n)!==norm(state.name));
          if(coords.length) state.notice = 'Dzięki, skontaktuj się z ' + coords.map(instrName).join(' lub ') + '.';
          else if(key==='room') state.notice = 'Super, skontaktuj się z koordynatorem kursu.';
          else state.notice = 'Super, skontaktuj się z koordynatorem posiłków tego dnia.';
        }
        if(state.notice) render();
      }
    });
  });

  document.querySelectorAll('[data-remove-vol]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const course = state.courses.find(c=>c.id===state.selectedCourseId);
      const cat = btn.dataset.removeVol;
      const nameToRemove = btn.dataset.removeName;
      const v = course.volunteerSlots[cat];
      v.people = v.people.filter(p=>norm(p)!==norm(nameToRemove));
      await saveCourses();
      render();
    });
  });

  // modal generic
  const overlay = document.getElementById('modalOverlay');
  if(overlay){
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ state.modal=null; render(); } });
  }
  const cancelBtn = document.getElementById('modalCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.modal=null; render(); });

  const noticeOk = document.getElementById('noticeOk');
  if(noticeOk) noticeOk.addEventListener('click', ()=>{ state.notice=''; render(); });
  const photoInput = document.getElementById('f_photo');
  if(photoInput) photoInput.addEventListener('change', ()=>{
    const file = photoInput.files && photoInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const S = 300;
        const side = Math.min(img.width, img.height);
        const cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        cv.getContext('2d').drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
        collectCourseFormIntoState();
        state.editingCourse.teacherPhoto = cv.toDataURL('image/jpeg', 0.75);
        render();
      };
      img.onerror = ()=> showToast('Nie udało się wczytać zdjęcia.');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  const photoRemove = document.getElementById('f_photo_remove');
  if(photoRemove) photoRemove.addEventListener('click', ()=>{
    collectCourseFormIntoState();
    state.editingCourse.teacherPhoto = '';
    render();
  });

  const saveCourseBtn = document.getElementById('modalSaveCourse');
  if(saveCourseBtn) saveCourseBtn.addEventListener('click', async ()=>{
    collectCourseFormIntoState();
    const c = state.editingCourse;
    if(!c.title.trim()){ showToast('Podaj tytuł kursu.'); return; }
    if(!c.dateStart){ showToast('Podaj datę rozpoczęcia.'); return; }
    if(!c.dateEnd) c.dateEnd = c.dateStart;
    const idx = state.courses.findIndex(x=>x.id===c.id);
    if(idx>=0) state.courses[idx] = c; else state.courses.push(c);
    state.modal = null;
    await saveCourses();
    render();
    showToast('Kurs zapisany.');
  });

}

function collectCourseFormIntoState(){
  const c = state.editingCourse;
  c.title = document.getElementById('f_title').value;
  c.dateStart = document.getElementById('f_dateStart').value;
  c.dateEnd = document.getElementById('f_dateEnd').value;
  c.aktualnosci = document.getElementById('f_aktualnosci').value;
  c.program = document.getElementById('f_program').value;
  const coordEl = document.getElementById('f_need_coord_course');
  if(coordEl) c.volunteerSlots.coord_course.needed = Math.min(2, Math.max(1, parseInt(coordEl.value,10) || 1));
  const roomEl = document.getElementById('f_need_room');
  if(roomEl) c.volunteerSlots.room.needed = Math.min(2, Math.max(1, parseInt(roomEl.value,10) || 1));
  MEAL_TYPES.forEach(m=>{
    const el = document.getElementById('f_need_meal_'+m.key);
    if(!el) return;
    const n = Math.min(6, Math.max(1, parseInt(el.value,10) || 2));
    MEAL_DAYS.forEach(d=>{ const sl = c.volunteerSlots[`meal_${d.key}_${m.key}`]; if(sl) sl.needed = n; });
  });
  const shopEl = document.getElementById('f_need_shopping');
  if(shopEl) c.volunteerSlots.shopping.needed = Math.min(2, Math.max(1, parseInt(shopEl.value,10) || 1));
}

render();
</script>
</body>
</html>
